<h2>Add Important Question</h2>

<form action="/addImportantQuestion" method="POST">

<input type="text" name="topic" required><br><br>

<textarea name="answer" rows="4" cols="50"></textarea><br><br>

<button type="submit">Add Important Question</button>

</form>
