<!DOCTYPE html>
<html>
<head>
	<title>Register | SMARTLEARN</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">

<main class="auth-card">
<p class="eyebrow">SMARTLEARN</p>
<h2>Create your account</h2>
<p class="auth-subtitle">Start learning with courses, notes, videos, and quizzes.</p>

<form action="/register" method="POST">

<label for="name">Name</label>
<input id="name" type="text" name="name" required autocomplete="name">

<label for="email">Email</label>
<input id="email" type="email" name="email" required autocomplete="email">

<label for="password">Password</label>
<input id="password" type="password" name="password" required minlength="6" autocomplete="new-password">

<button type="submit">Create account</button>

</form>

<p class="auth-footer">Already registered? <a href="/login.html">Sign in</a></p>
</main>
</body>
</html>
