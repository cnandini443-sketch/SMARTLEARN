<h2>Add Course Video</h2>

<form action="/addCourse" method="POST">

Topic:<br>
<input type="text" name="topic"><br><br>

Course Name:<br>
<input type="text" name="courseName"><br><br>

Video Title:<br>
<input type="text" name="videoTitle"><br><br>

YouTube Embed Link:<br>
<input type="text" name="videoLink"><br><br>

PDF Link:<br>
<input type="text" name="pdfLink"><br><br>

Lecture Notes:<br>
<textarea name="lectureNotes" rows="5" cols="40" placeholder="Short summary of the lecture"></textarea><br><br>

<button type="submit">Add Course</button>

</form>
