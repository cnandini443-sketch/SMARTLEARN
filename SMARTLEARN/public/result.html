<!DOCTYPE html>
<html>
<head>
<title>Quiz Result</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="result-page">

<div class="result-card">
  <h2>Quiz Result</h2>
  
  <p>Your quiz on <strong id="resTopic">...</strong> is completed successfully.</p>
  
  <div class="score-display">
    <h3>Score: <span id="resScore">0</span> / <span id="resTotal">0</span></h3>
  </div>
  
  <br>
  <a href="/dashboard.html">
    <button>Go to Dashboard</button>
  </a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const score = params.get('score');
  const total = params.get('total');
  const topic = params.get('topic');

  if(score) document.getElementById('resScore').innerText = score;
  if(total) document.getElementById('resTotal').innerText = total;
  if(topic) document.getElementById('resTopic').innerText = topic;
</script>

</body>
</html>
